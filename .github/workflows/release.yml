name: Release VSIX
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - name: Verify tag and publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node -e 'const p=require("./package.json");if(process.env.GITHUB_REF_NAME!=="v"+p.version)throw Error("Tag must match package version")'
          gh release create "$GITHUB_REF_NAME" artifacts/workspace-map.vsix artifacts/workspace-map.vsix.sha256 artifacts/release.json --verify-tag --title "Workspace Map $GITHUB_REF_NAME" --notes-file artifacts/RELEASE.md
