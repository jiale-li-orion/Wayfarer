  </defs>
  <rect width="1080" height="264" rx="18" fill="url(#sky)"/>
  <rect width="1080" height="264" rx="18" fill="url(#grid)"/>
  <g transform="translate(48 37)" stroke="#9ce6c9" stroke-width="3" stroke-linejoin="round">
